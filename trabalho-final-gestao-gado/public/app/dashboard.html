<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🐄 Dashboard - Gestão de Gado</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>

  <body>
    <!-- NAVBAR (injetada por components.js) -->
    <div id="navbar"></div>

    <!-- ============================================ -->
    <!-- MAIN CONTENT -->
    <!-- ============================================ -->
    <main class="main-content">
      <!-- PÁGINA: DASHBOARD -->
      <div id="page-dashboard" class="page-content active">
        <div class="card">
          <div class="card-header">
            <h2><i class="fa-solid fa-chart-column"></i> Dashboard</h2>
            <div class="card-actions">
              <button class="btn btn-secondary btn-sm" onclick="app.loadDashboard()">
                <i class="fa-solid fa-arrows-rotate"></i> Atualizar
              </button>
            </div>
          </div>
          <div id="dashboardContent">
            <div class="loading">
              <div class="spinner"></div>
              <p>Carregando dashboard...</p>
            </div>
          </div>
        </div>
      </div>

      <!-- PÁGINA: ANIMAIS -->
      <div id="page-animais" class="page-content">
        <div class="card">
          <div class="card-header">
            <h2><i class="fa-solid fa-cow"></i> Rebanho</h2>
            <div class="card-actions">
              <button class="btn btn-primary btn-sm" onclick="app.novoAnimal()">
                <i class="fa-solid fa-plus"></i> Novo Animal
              </button>
              <button class="btn btn-secondary btn-sm" onclick="app.loadAnimais()">
                <i class="fa-solid fa-arrows-rotate"></i> Atualizar
              </button>
            </div>
          </div>
          <div id="animaisContent">
            <div class="loading">
              <div class="spinner"></div>
              <p>Carregando animais...</p>
            </div>
          </div>
        </div>
      </div>

      <!-- PÁGINA: PRODUÇÕES -->
      <div id="page-producoes" class="page-content">
        <div class="card">
          <div class="card-header">
            <h2><i class="fa-solid fa-droplet"></i> Produções de Leite</h2>
            <div class="card-actions">
              <button class="btn btn-primary btn-sm" onclick="app.novaProducao()">
                <i class="fa-solid fa-plus"></i> Nova Produção
              </button>
              <button class="btn btn-secondary btn-sm" onclick="app.loadProducoes()">
                <i class="fa-solid fa-arrows-rotate"></i> Atualizar
              </button>
            </div>
          </div>
          <div id="producoesContent">
            <div class="loading">
              <div class="spinner"></div>
              <p>Carregando produções...</p>
            </div>
          </div>
        </div>
      </div>

      <!-- PÁGINA: RELATÓRIOS -->
      <div id="page-relatorios" class="page-content">
        <div class="card">
          <div class="card-header">
            <h2><i class="fa-solid fa-clipboard-list"></i> Relatórios</h2>
            <div class="card-actions">
              <button class="btn btn-secondary btn-sm" onclick="app.loadRelatorios()">
                <i class="fa-solid fa-arrows-rotate"></i> Atualizar
              </button>
            </div>
          </div>
          <div id="relatoriosContent">
            <div class="loading">
              <div class="spinner"></div>
              <p>Carregando relatórios...</p>
            </div>
          </div>
        </div>
      </div>

      <!-- PÁGINA: USUÁRIOS -->
      <div id="page-usuarios" class="page-content">
        <div class="card">
          <div class="card-header">
            <h2><i class="fa-solid fa-user"></i> Usuários</h2>
            <div class="card-actions">
              <button class="btn btn-secondary btn-sm" onclick="app.loadUsuarios()">
                <i class="fa-solid fa-arrows-rotate"></i> Atualizar
              </button>
            </div>
          </div>
          <div id="usuariosContent">
            <div class="loading">
              <div class="spinner"></div>
              <p>Carregando usuários...</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ============================================ -->
    <!-- FOOTER -->
    <!-- ============================================ -->
    <footer class="footer">
      <div class="container">
        <p><i class="fa-solid fa-cow"></i> Gestão de Gado &copy; 2026 - Todos os direitos reservados</p>
      </div>
    </footer>

    <!-- ============================================ -->
    <!-- MODALS -->
    <!-- ============================================ -->

    <!-- Modal Animal -->
    <div class="modal-overlay" id="modalAnimal">
      <div class="modal modal-lg">
        <div class="modal-header">
          <h3 id="modalAnimalTitle"><i class="fa-solid fa-cow"></i> Novo Animal</h3>
          <button class="modal-close" onclick="app.closeModal('animal')">×</button>
        </div>
        <div class="modal-body">
          <form id="animalForm">
            <div class="form-row">
              <div class="form-group">
                <label>Brinco *</label><input type="number" id="animalBrinco" placeholder="Ex: 1015" required />
              </div>
              <div class="form-group">
                <label>Nome *</label><input type="text" id="animalNome" placeholder="Ex: Mimosa" required />
              </div>
            </div>
            <div class="form-row-3">
              <div class="form-group">
                <label>Sexo *</label
                ><select id="animalSexo">
                  <option value="F">Fêmea</option>
                  <option value="M">Macho</option>
                </select>
              </div>
              <div class="form-group">
                <label>Raça</label><input type="text" id="animalRaca" placeholder="Ex: Holandesa" />
              </div>
              <div class="form-group">
                <label>Status</label>
                <label class="switch" title="Clique para alternar entre Ativo e Inativo">
                  <input type="checkbox" id="animalAtivo" checked onchange="app.atualizarLabelStatusAnimal()" />
                  <span class="switch-slider"></span>
                  <span class="switch-label" id="animalAtivoLabel">Ativo</span>
                </label>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Peso (kg) *</label
                ><input type="number" id="animalPeso" step="0.1" placeholder="Ex: 420.5" required />
              </div>
              <div class="form-group">
                <label>Data Nascimento *</label><input type="date" id="animalDataNascimento" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Brinco do Pai</label
                ><select id="animalBrincoPai">
                  <option value="">Nenhum</option>
                </select>
              </div>
              <div class="form-group">
                <label>Brinco da Mãe</label
                ><select id="animalBrincoMae">
                  <option value="">Nenhuma</option>
                </select>
              </div>
            </div>
            <input type="hidden" id="animalEditBrinco" />
            <div class="form-actions">
              <button type="button" class="btn btn-secondary" onclick="app.closeModal('animal')">Cancelar</button>
              <button type="submit" class="btn btn-primary" id="animalSubmitBtn">Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Modal Produção -->
    <div class="modal-overlay" id="modalProducao">
      <div class="modal modal-lg">
        <div class="modal-header">
          <h3 id="modalProducaoTitle"><i class="fa-solid fa-droplet"></i> Nova Produção</h3>
          <button class="modal-close" onclick="app.closeModal('producao')">×</button>
        </div>
        <div class="modal-body">
          <form id="producaoForm">
            <div class="form-row">
              <div class="form-group">
                <label>Animal *</label
                ><select id="producaoAnimal" required></select>
              </div>
              <div class="form-group"><label>Data *</label><input type="date" id="producaoData" required /></div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Litros *</label
                ><input type="number" id="producaoLitros" step="0.1" min="0" placeholder="Ex: 15.5" required />
              </div>
              <div class="form-group">
                <label>Período *</label
                ><select id="producaoPeriodo">
                  <option value="Manha">🌅 Manhã</option>
                  <option value="Tarde">☀️ Tarde</option>
                  <option value="Noite">🌙 Noite</option>
                </select>
              </div>
            </div>
            <input type="hidden" id="producaoEditId" />
            <div class="form-actions">
              <button type="button" class="btn btn-secondary" onclick="app.closeModal('producao')">Cancelar</button>
              <button type="submit" class="btn btn-primary" id="producaoSubmitBtn">Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- ============================================ -->
    <!-- TOAST -->
    <!-- ============================================ -->
    <div id="toast" class="toast"></div>

    <!-- ============================================ -->
    <!-- SCRIPTS -->
    <!-- ============================================ -->
    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/pages/dashboard.js"></script>
  </body>
</html>
