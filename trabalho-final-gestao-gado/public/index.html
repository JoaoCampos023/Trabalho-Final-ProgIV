<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🐄 Gestão de Gado</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>" />
</head>
<body>
    <div id="app">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="container">
                <div class="navbar-brand">
                    <span class="brand-icon">🐄</span>
                    <span class="brand-text">Gestão<span>Gado</span></span>
                </div>
                <div class="navbar-menu" id="navMenu">
                    <a href="#" class="nav-link active" data-page="dashboard">📊 Dashboard</a>
                    <a href="#" class="nav-link" data-page="animais">🐮 Rebanho</a>
                    <a href="#" class="nav-link" data-page="producoes">🥛 Produções</a>
                    <a href="#" class="nav-link" data-page="usuarios" id="navUsuarios">👤 Usuários</a>
                </div>
                <div class="navbar-auth" id="navAuth">
                    <div class="user-info" id="userInfo" style="display:none;">
                        <span class="user-avatar" id="userAvatar">👤</span>
                        <span class="user-name" id="userName">Usuário</span>
                        <button class="btn btn-sm btn-danger" onclick="app.logout()">Sair</button>
                    </div>
                    <div class="auth-buttons" id="authButtons">
                        <button class="btn btn-outline btn-sm" onclick="app.showModal('login')">Entrar</button>
                        <button class="btn btn-primary btn-sm" onclick="app.showModal('register')">Registrar</button>
                    </div>
                </div>
                <button class="mobile-toggle" id="mobileToggle">☰</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <!-- Páginas -->
                <div id="page-dashboard" class="page active">Carregando dashboard...</div>
                <div id="page-animais" class="page">Carregando rebanho...</div>
                <div id="page-producoes" class="page">Carregando produções...</div>
                <div id="page-usuarios" class="page">Carregando usuários...</div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <p>🐄 Gestão de Gado &copy; 2026 - Trabalho Final</p>
            </div>
        </footer>

        <!-- Modals -->
        <div class="modal-overlay" id="modalLogin">
            <div class="modal">
                <div class="modal-header">
                    <h3>🔐 Entrar</h3>
                    <button class="modal-close" onclick="app.closeModal('login')">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="seu@email.com" />
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="loginPassword" placeholder="******" />
                    </div>
                    <button class="btn btn-primary w-100" onclick="app.login()">Entrar</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="modalRegister">
            <div class="modal">
                <div class="modal-header">
                    <h3>📝 Registrar</h3>
                    <button class="modal-close" onclick="app.closeModal('register')">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" id="regNome" placeholder="Seu nome" />
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" placeholder="seu@email.com" />
                    </div>
                    <div class="form-group">
                        <label>CPF</label>
                        <input type="text" id="regCpf" placeholder="000.000.000-00" />
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="regPassword" placeholder="******" />
                    </div>
                    <div class="form-group">
                        <label>Confirmar Senha</label>
                        <input type="password" id="regConfirmPassword" placeholder="******" />
                    </div>
                    <button class="btn btn-success w-100" onclick="app.register()">Criar Conta</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="modalAnimal">
            <div class="modal modal-lg">
                <div class="modal-header">
                    <h3 id="modalAnimalTitle">🐮 Novo Animal</h3>
                    <button class="modal-close" onclick="app.closeModal('animal')">×</button>
                </div>
                <div class="modal-body">
                    <form id="animalForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Brinco *</label>
                                <input type="number" id="animalBrinco" required />
                            </div>
                            <div class="form-group">
                                <label>Nome *</label>
                                <input type="text" id="animalNome" required />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Sexo *</label>
                                <select id="animalSexo" required>
                                    <option value="F">Fêmea</option>
                                    <option value="M">Macho</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Raça</label>
                                <input type="text" id="animalRaca" />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Peso (kg) *</label>
                                <input type="number" id="animalPeso" step="0.1" required />
                            </div>
                            <div class="form-group">
                                <label>Data Nascimento *</label>
                                <input type="date" id="animalDataNascimento" required />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Brinco do Pai</label>
                                <input type="number" id="animalBrincoPai" />
                            </div>
                            <div class="form-group">
                                <label>Brinco da Mãe</label>
                                <input type="number" id="animalBrincoMae" />
                            </div>
                        </div>
                        <input type="hidden" id="animalEditBrinco" />
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="app.closeModal('animal')">Cancelar</button>
                            <button type="submit" class="btn btn-primary" id="animalSubmitBtn">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="modalProducao">
            <div class="modal modal-lg">
                <div class="modal-header">
                    <h3 id="modalProducaoTitle">🥛 Nova Produção</h3>
                    <button class="modal-close" onclick="app.closeModal('producao')">×</button>
                </div>
                <div class="modal-body">
                    <form id="producaoForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Animal *</label>
                                <select id="producaoAnimal" required></select>
                            </div>
                            <div class="form-group">
                                <label>Data *</label>
                                <input type="date" id="producaoData" required />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Litros *</label>
                                <input type="number" id="producaoLitros" step="0.1" required />
                            </div>
                            <div class="form-group">
                                <label>Período *</label>
                                <select id="producaoPeriodo" required>
                                    <option value="Manha">🌅 Manhã</option>
                                    <option value="Tarde">☀️ Tarde</option>
                                    <option value="Noite">🌙 Noite</option>
                                </select>
                            </div>
                        </div>
                        <input type="hidden" id="producaoEditId" />
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="app.closeModal('producao')">Cancelar</button>
                            <button type="submit" class="btn btn-primary" id="producaoSubmitBtn">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
